name: 发布 3D 模型

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 发布到 GitHub Pages
        type: boolean
        default: false

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prepare and verify model.html
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          asset=$(jq -c '.assets[] | select(.name == "model.html" and .state == "uploaded")' <<< "$release")
          if [[ -z "$asset" ]]; then
            echo 'The latest release must include an uploaded model.html asset.' >&2
            exit 1
          fi

          asset_id=$(jq -er '.id' <<< "$asset")
          digest=$(jq -er '.digest' <<< "$asset")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'GitHub did not provide a SHA-256 checksum for model.html.' >&2
            exit 1
          fi

          mkdir -p site
          asset_path="repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          gh api -H 'Accept: application/octet-stream' "$asset_path" > site/index.html
          printf '%s  %s\n' "${digest#sha256:}" site/index.html | sha256sum --check
      - name: Package the Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
